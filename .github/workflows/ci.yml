name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  integration-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Create .env for CI
        run: |
          echo "DB_USER=testuser" >> .env
          echo "DB_PASSWORD=testpass" >> .env
          echo "DB_NAME=testdb" >> .env

      - name: Prepare output dir permissions
        run: |
          mkdir -p output data
          sudo chown 10001:10001 output

      - name: Start stack
        run: docker compose up --build -d

      - name: Wait for app to finish / check logs
        run: docker compose logs app

      - name: Scan app image
        uses: aquasecurity/trivy-action@v0.70.0
        with:
          image-ref: trainee-app:latest
          severity: HIGH,CRITICAL
          exit-code: '1'
        
      - name: Tear down
        run: docker compose down -v